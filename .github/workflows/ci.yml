name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run check:board
      - run: bun run build:board

  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun test packages/db packages/engine apps/api

  # Single required status for the main ruleset: gate on this one job instead
  # of enumerating every check.
  checks-pass:
    if: always()
    needs: [check, db]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail if any required check did not succeed
        env:
          NEEDS: ${{ toJson(needs) }}
        run: |
          echo "$NEEDS"
          if echo "$NEEDS" | grep -qE '"result": *"(failure|cancelled)"'; then
            echo "::error::A required check failed."
            exit 1
          fi
