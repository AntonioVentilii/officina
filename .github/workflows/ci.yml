name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Squash-merge titles become the commits on main, so PR titles must be
  # Conventional Commits with a scope.
  pr-title:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Skip outside pull requests
        if: github.event_name != 'pull_request'
        run: echo "PR title check only runs for pull_request events."

      - name: Validate Conventional Commit PR title (scope required)
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|deps|revert|docs|style|chore|refactor|test|build|ci)\([-a-zA-Z0-9,._/]+\)!?: .+$'

          if [[ "$PR_TITLE" =~ $pattern ]]; then
            echo "PR title OK."
            exit 0
          fi

          # Keep the title off the start of a line so it can't inject a ::workflow:: command.
          echo "::error::PR title must be a Conventional Commit with a scope: 'type(scope): description' (or 'type(scope)!: ...' for a breaking change), e.g. 'feat(engine): ...'."
          echo "Got title: $PR_TITLE"
          exit 1

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run check:board
      - run: bun run build:board

  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun test packages/db packages/engine apps/api

  # Single required status for the main ruleset: gate on this one job instead
  # of enumerating every check.
  checks-pass:
    if: always()
    needs: [pr-title, check, db]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      # Anything but success fails, so a skipped job cannot slip through.
      - name: Fail if any required check did not succeed
        env:
          NEEDS: ${{ toJson(needs) }}
        run: |
          echo "$NEEDS"
          if ! echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null; then
            echo "::error::A required check failed."
            exit 1
          fi
