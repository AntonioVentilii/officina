app = "vici-officina"
primary_region = "ams"

# Public identifiers for Anthropic workload identity federation: the machine proves its identity
# with a Fly OIDC token, so no Anthropic API key is stored anywhere.
[env]
  ANTHROPIC_FEDERATION_RULE_ID = "fdrl_018jgpUk8osKSBgzbZnAna6D"
  ANTHROPIC_ORGANIZATION_ID = "b4c6858e-c21f-469d-b0e7-d615481fbc2c"
  ANTHROPIC_SERVICE_ACCOUNT_ID = "svac_0186Y6oZ4rytk8sDqDJiT2sV"
  ANTHROPIC_WORKSPACE_ID = "wrkspc_01GSzPabbQGWhbSVM7LQE7oV"
  OFFICINA_PUBLIC_URL = "https://vici-officina.fly.dev"
  GITHUB_APP_CLIENT_ID = "Iv23li4qjvBCOkVP17hj"

[http_service]
  internal_port = 8080
  force_https = true
  # The scheduler runs inside this machine, so it must stay up. Run exactly one machine: orphaned-run
  # recovery on boot assumes a single scheduler instance.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
