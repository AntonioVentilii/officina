app = "vici-officina"
primary_region = "ams"

[http_service]
  internal_port = 8080
  force_https = true
  # The scheduler runs inside this machine, so it must stay up. Run exactly one machine: orphaned-run
  # recovery on boot assumes a single scheduler instance.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
